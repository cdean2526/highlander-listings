<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Highlanders">
<title>Highlander Listings</title>
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e0e0da;
    --accent: #2b5fa8; --accent-soft: #e8eef8; --new: #0a7d28; --up: #b00020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1f1f1f; --text: #ececea; --muted: #9a9a94; --line: #333331;
      --accent: #7fa8e8; --accent-soft: #24304a; --new: #5cc77a; --up: #ff7a8a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size: 21px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }

  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px 20px; }
  .f label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .pair { display: flex; align-items: center; gap: 8px; }
  .pair span { color: var(--muted); font-size: 14px; }
  input[type=number], select {
    width: 100%; min-width: 0; height: 44px; padding: 0 10px; font: inherit; font-size: 16px; /* 16px stops iPhone auto-zoom */
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  input[type=number]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row2 { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-top: 14px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 36px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .reset { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }

  .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 10px;
         background: var(--bg); padding: 8px 2px; margin-bottom: 4px; }
  .bar .count { font-weight: 600; }
  .bar select { width: auto; height: 38px; font-size: 15px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .card.main { border-left: 4px solid var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .price { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .chg { font-size: 13px; font-weight: 600; } .down { color: var(--new); } .up { color: var(--up); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .tag.new { color: #fff; background: var(--new); }
  .tag.main { color: var(--accent); background: var(--accent-soft); }
  .title { font-weight: 600; }
  .facts { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .links a { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Toyota Highlanders near Eugene</h1>
  <p class="sub" id="sub"></p>

  <section class="filters">
    <div class="grid">
      <div class="f"><label for="yMin">Year</label>
        <div class="pair"><input id="yMin" type="number" inputmode="numeric" placeholder="from"><span>to</span><input id="yMax" type="number" inputmode="numeric" placeholder="to"></div></div>
      <div class="f"><label for="pMax">Price ($)</label>
        <div class="pair"><input id="pMin" type="number" inputmode="numeric" placeholder="min"><span>to</span><input id="pMax" type="number" inputmode="numeric" placeholder="max"></div></div>
      <div class="f"><label for="mMax">Mileage</label>
        <div class="pair"><input id="mMin" type="number" inputmode="numeric" placeholder="min"><span>to</span><input id="mMax" type="number" inputmode="numeric" placeholder="max"></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row2">
      <label class="check"><input type="checkbox" id="newOnly"> New since last email only</label>
      <label class="check"><input type="checkbox" id="unknown" checked> Include unknown price/miles</label>
      <button class="reset" id="reset" type="button">Reset</button>
    </div>
  </section>

  <div class="bar">
    <span class="count" id="count"></span>
    <select id="sort" aria-label="Sort">
      <option value="price:1">Price: low to high</option>
      <option value="price:-1">Price: high to low</option>
      <option value="miles:1">Miles: low to high</option>
      <option value="year:-1">Year: newest first</option>
      <option value="year:1">Year: oldest first</option>
      <option value="firstSeen:-1">Recently listed</option>
    </select>
  </div>
  <div id="out"></div>
</div>

2002 Toyota Highlander Limited","year":2002,"price":5000,"miles":170000,"location":"Eugene","sources":["Craigslist"],"urls":["https://www.craigslist.org/view/d/eugene-2002-toyota-highlander-limited/8NCZRLbgXJACzZchkMUEFb"],"firstSeen":"2026-10-21","lastPrice":5000,"isNew":false,"isMain":false}];
const META = {"date":"2026-10-21","radius":100,"main":[2012,2013],"yearMin":2000,"yearMax":2020};

const $ = id => document.getElementById(id);
const fmt = n => n == null ? "" : Number(n).toLocaleString("en-US");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FIELDS = ["yMin", "yMax", "pMin", "pMax", "mMin", "mMax"];
const mainLabel = (META.main || []).join("–");
const STORE = "highlander-filters";

$("sub").textContent = "Updated " + META.date + " · within " + META.radius + " miles · " + DATA.length + " listings";

// One-tap presets: each sets some fields; tapping an active one clears those fields again.
const PRESETS = [
  { label: mainLabel + " only", set: { yMin: META.main[0], yMax: META.main[META.main.length - 1] } },
  { label: "Under $8k",   set: { pMax: 8000 } },
  { label: "Under $12k",  set: { pMax: 12000 } },
  { label: "Under $15k",  set: { pMax: 15000 } },
  { label: "Under 120k mi", set: { mMax: 120000 } },
  { label: "Under 160k mi", set: { mMax: 160000 } },
];
function presetOn(p) { return Object.entries(p.set).every(([k, v]) => $(k).value === String(v)); }
function drawChips() {
  $("chips").innerHTML = PRESETS.map((p, i) => '<button type="button" class="chip' + (presetOn(p) ? " on" : "") + '" data-i="' + i + '">' + esc(p.label) + "</button>").join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const p = PRESETS[b.dataset.i], on = presetOn(p);
    for (const [k, v] of Object.entries(p.set)) $(k).value = on ? "" : v;
    update();
  });
}

function num(id) { const v = $(id).value.trim(); return v === "" ? null : Number(v); }
function inRange(v, lo, hi, keepUnknown) {
  if (v == null) return keepUnknown || (lo == null && hi == null);
  return (lo == null || v >= lo) && (hi == null || v <= hi);
}

function save() {
  try {
    const s = { sort: $("sort").value, newOnly: $("newOnly").checked, unknown: $("unknown").checked };
    FIELDS.forEach(id => s[id] = $(id).value);
    localStorage.setItem(STORE, JSON.stringify(s));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!s) return;
    FIELDS.forEach(id => { if (s[id] != null) $(id).value = s[id]; });
    if (s.sort) $("sort").value = s.sort;
    $("newOnly").checked = !!s.newOnly; $("unknown").checked = s.unknown !== false;
  } catch (e) {}
}

function render() {
  const yMin = num("yMin"), yMax = num("yMax"), pMin = num("pMin"), pMax = num("pMax"), mMin = num("mMin"), mMax = num("mMax");
  const keep = $("unknown").checked, newOnly = $("newOnly").checked;
  const [key, dirStr] = $("sort").value.split(":"), dir = Number(dirStr);
  const rows = DATA.filter(d =>
    inRange(d.year, yMin, yMax, keep) && inRange(d.price, pMin, pMax, keep) && inRange(d.miles, mMin, mMax, keep) && (!newOnly || d.isNew));
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });

  $("count").textContent = rows.length + " of " + DATA.length;
  if (!rows.length) { $("out").innerHTML = '<div class="empty">No listings match. Try widening a filter or tap Reset.</div>'; return; }

  $("out").innerHTML = '<div class="cards">' + rows.map(d => {
    let chg = "";
    if (d.lastPrice && d.price && d.lastPrice !== d.price) {
      const diff = d.price - d.lastPrice;
      chg = ' <span class="chg ' + (diff < 0 ? "down" : "up") + '">' + (diff < 0 ? "↓" : "↑") + " $" + fmt(Math.abs(diff)) + "</span>";
    }
    const facts = [d.year || "year ?", d.miles == null ? "miles ?" : fmt(d.miles) + " mi", d.location].filter(Boolean).map(esc).join(" · ");
    const tags = (d.isNew ? '<span class="tag new">NEW</span>' : "") + (d.isMain ? '<span class="tag main">' + mainLabel + "</span>" : "");
    const links = d.urls.map((u, i) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(d.sources[i]) + " ↗</a>").join("");
    return '<article class="card' + (d.isMain ? " main" : "") + '">' +
      '<div class="top"><span class="price">' + (d.price == null ? "Price ?" : "$" + fmt(d.price)) + chg + "</span>" +
      (tags ? '<span class="tags">' + tags + "</span>" : "") + "</div>" +
      '<div class="title">' + esc(d.title) + "</div>" +
      '<div class="facts">' + facts + "</div>" +
      '<div class="facts">First seen ' + esc(d.firstSeen) + "</div>" +
      '<div class="links">' + links + "</div></article>";
  }).join("") + "</div>";
}

function update() { drawChips(); render(); save(); }
FIELDS.forEach(id => $(id).addEventListener("input", update));
["newOnly", "unknown", "sort"].forEach(id => $(id).addEventListener("change", update));
$("reset").onclick = () => {
  FIELDS.forEach(id => $(id).value = ""); $("newOnly").checked = false; $("unknown").checked = true; $("sort").value = "price:1";
  update();
};
load(); update();
</script>
